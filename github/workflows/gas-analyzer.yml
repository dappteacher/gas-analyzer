name: Gas Analyzer

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  analyze:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22


      - name: Install Dependencies
        run: npm install


      - name: Run Gas Analyzer
        run: |
          node index.js contracts/Sample.sol